name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python-version: "3.11"
            mujoco_gl: ""
          - os: ubuntu-latest
            python-version: "3.11"
            mujoco_gl: "egl"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libgl1-mesa-glx libosmesa6-dev libglew-dev libegl1-mesa ffmpeg

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          uv venv --python ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: |
          uv pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          .venv/bin/python -m ruff check src tests

      - name: Type check with mypy
        run: |
          .venv/bin/python -m mypy src

      - name: Run unit tests
        env:
          MUJOCO_GL: ${{ matrix.mujoco_gl }}
        run: |
          .venv/bin/python -m pytest tests/ -v --cov=src/rigsim --cov-report=term-missing
