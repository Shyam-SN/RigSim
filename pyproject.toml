[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rigsim"
version = "0.1.0"
description = "Multi-Camera + IMU Capture Simulator, Real Rig, and Automated Data QA Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "RigSim Authors" }
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "mujoco>=3.1.0",
    "opencv-contrib-python>=4.8.0.76",
    "mcap>=1.1.0",
    "foxglove-schemas-protobuf>=0.3.0",
    "mcap-protobuf-support>=0.4.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.3",
    "plotly>=5.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "types-pyyaml>=6.0.12.20240311",
    "pre-commit>=3.6.0",
    "hypothesis>=6.98.0",
    "pygame>=2.5.0",
]

[project.scripts]
rigsim = "rigsim.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rigsim"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
